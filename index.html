<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Обмер по стенам</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: план сверху, под ним карточка «один вопрос — один ответ»; ниже итоги и список замеров */
:root{
  --paper:#eef1ee; --sheet:#ffffff; --grid:#e0e6e1; --ink:#1d2b3a; --muted:#5d6b76;
  --line:#cbd4ce; --wall:#27323d; --floor:#fdfdfb; --glass:#bfe0f2; --accent:#d9480f;
  --ok:#2b8a3e; --warn:#b86e00; --chip:#e6ece8; --room:#1f6fb2; --shade:rgba(15,20,25,.45); --elec:#6741d9; --heat:#c2255c; --note:#e8a400; --noteink:#3b2a00;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1418; --sheet:#161d23; --grid:#1f2830; --ink:#e3e9ee; --muted:#95a3ae;
  --line:#2d3a44; --wall:#cfd8df; --floor:#1c252d; --glass:#2f5f7a; --accent:#ff8a4c;
  --ok:#5fcf74; --warn:#f0b43c; --chip:#1f2830; --room:#7cb6ea; --shade:rgba(0,0,0,.6); --elec:#b197fc; --heat:#f783ac; --note:#ffc94d; --noteink:#2b1f00; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1418; --sheet:#161d23; --grid:#1f2830; --ink:#e3e9ee; --muted:#95a3ae;
  --line:#2d3a44; --wall:#cfd8df; --floor:#1c252d; --glass:#2f5f7a; --accent:#ff8a4c;
  --ok:#5fcf74; --warn:#f0b43c; --chip:#1f2830; --room:#7cb6ea; --shade:rgba(0,0,0,.6); --elec:#b197fc; --heat:#f783ac; --note:#ffc94d; --noteink:#2b1f00; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.hbtns{display:flex;gap:6px;flex-wrap:wrap}
.cols{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:960px){.cols{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}.left{position:sticky;top:12px}}
.left,.right{display:grid;gap:12px;min-width:0}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:10px;min-width:0;overflow:hidden}
.plan{aspect-ratio:4/3;max-height:44vh;width:100%;
  background-color:var(--sheet);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px}
@media (min-width:960px){.plan{aspect-ratio:1/1;max-height:80vh}}
.plan svg,.elev svg{width:100%;height:100%;display:block}
.plan{position:relative}
.v3{width:100%;height:100%;touch-action:none}
.v3 canvas{display:block}
.vtabs{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg2 button{font:inherit;font-weight:600;font-size:14px;border:0;background:var(--paper);color:var(--muted);padding:7px 18px;cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.vswitch{position:absolute;left:8px;top:8px;z-index:3;font:inherit;font-weight:700;font-size:15px;min-width:52px;height:40px;padding:0 12px;border-radius:10px;border:0;background:var(--ink);color:var(--sheet);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.v3bar{position:absolute;right:8px;top:8px;z-index:3;display:flex;gap:6px}
.v3bar button{font:inherit;font-size:13px;font-weight:600;height:40px;min-width:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.ptitle{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}
.ptitle b{font-weight:600}
.elev{height:200px;padding:6px}
.muted{color:var(--muted)}
.btn{font:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:7px 12px;cursor:pointer;border:1px solid var(--line);background:var(--sheet);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--accent)}
.toast{font-size:12.5px;color:var(--ok);min-height:1em}
/* мастер */
.wiz{background:var(--sheet);border:2px solid var(--accent);border-radius:14px;padding:14px;display:grid;gap:12px}
.wtop{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.wtop b{color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.wq{font-size:22px;font-weight:700;line-height:1.2;margin:0;text-wrap:balance}
.wh{font-size:14px;color:var(--muted);margin:-6px 0 0}
.wpic{background:var(--paper);border-radius:10px;padding:6px;display:flex;justify-content:center}
.wpic svg{width:100%;max-width:300px;height:auto;display:block}
.winput{display:flex;align-items:center;gap:8px}
.winput input{font-family:var(--f-num);font-size:30px;font-weight:600;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 14px;width:100%;min-width:0}
.winput input.txt{font-family:var(--f-body);font-size:22px}
.winput input:focus{border-color:var(--accent);outline:none}
.winput .u{font-size:18px;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer}
.wnav{display:grid;grid-template-columns:auto 1fr;gap:8px}
.wnav .btn{font-size:17px;padding:14px 16px;border-radius:12px}
.choices{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.choices button{font:inherit;font-size:17px;font-weight:600;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:16px 8px;cursor:pointer;display:grid;gap:6px;justify-items:center;line-height:1.2}
.choices button b{font-size:28px;line-height:1}
.choices button small{font-size:12px;color:var(--muted);font-weight:400}
.choices button:hover,.choices button:focus-visible{border-color:var(--accent)}
.choices button.exit{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.choices .wide{grid-column:1 / -1}
.wdone{font-size:13.5px;color:var(--ok);font-weight:600}
.wlink{font:inherit;font-size:13.5px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;justify-self:start;padding:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* итоги */
.sum{display:grid}
.sumrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;padding:8px 12px;border-top:1px solid var(--line);align-items:center;font-size:13.5px}
.sumrow:first-child{border-top:0}
.sumrow .n{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sumrow .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.sumrow .d{grid-column:1 / -1;color:var(--muted);font-size:12px}
.sumrow.total{background:var(--chip);font-weight:600}
.pill{font-family:var(--f-num);font-size:11px;padding:2px 7px;border-radius:99px;font-weight:600;white-space:nowrap}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
/* список */
details.panel > summary{padding:10px 12px;cursor:pointer;font-weight:600;font-size:14px}
.log{display:grid;padding:0 0 4px;border-top:1px solid var(--line)}
.it{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 12px;cursor:pointer;border:0;background:none;text-align:left;font:inherit;color:inherit;width:100%}
.it:hover{background:color-mix(in srgb,var(--chip) 60%,transparent)}
.it.sel{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.it .no{font-family:var(--f-num);font-size:12px;color:var(--muted);text-align:right}
.it .tx{min-width:0}
.it .tx b{font-weight:600}
.it .tx small{display:block;color:var(--muted);font-size:12px}
.it .ed{font-size:12px;color:var(--muted)}
.it.bad .tx small{color:var(--warn)}
.roomlbl{padding:8px 12px 4px;font-size:12px;font-weight:700;color:var(--room);text-transform:uppercase;letter-spacing:.05em;border-top:1px solid var(--line)}
.ind{padding-left:calc(12px + var(--d) * 14px)}
/* форма правки */
.shade{position:fixed;inset:0;background:var(--shade);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheetbox{background:var(--sheet);width:100%;max-width:560px;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
@media (min-width:600px){.shade{align-items:center}.sheetbox{border-radius:16px}}
.sheetbox h2{margin:0;font-size:19px}
.sheetbox .lead{margin:-8px 0 0;color:var(--muted);font-size:13.5px}
.q2{display:grid;gap:6px}
.q2 > span{font-size:14px;font-weight:600}
.q2 > small{color:var(--muted);font-size:12px;margin-top:-4px}
.q2 input{font-family:var(--f-num);font-size:20px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.q2 input.txt{font-family:var(--f-body);font-size:17px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid3 .q2 > span{font-size:12.5px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg button{font:inherit;font-weight:600;font-size:15px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:12px 6px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--sheet));color:var(--accent)}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.actions .btn{padding:11px 16px;font-size:15px}
.nhint{font-size:12.5px;color:var(--muted);padding:6px 12px;border-top:1px solid var(--line)}
.plan svg{cursor:crosshair}
textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:140px;resize:vertical}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
/* шапка и меню */
header.top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px}
.iconbtn{font-size:22px;line-height:1;padding:4px 14px;border-radius:10px}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:25;background:var(--sheet);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:grid;min-width:220px;overflow:hidden}
.menu button{font:inherit;font-size:15px;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);padding:13px 16px;cursor:pointer}
.menu button:first-child{border-top:0}
.menu button.danger{color:var(--accent)}
/* зум плана */
.zoom{position:absolute;right:8px;bottom:8px;display:grid;gap:6px}
.zoom button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font-size:20px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.08)}
#plan{touch-action:none}
/* нижние вкладки — только на телефоне */
.tabbar{display:none}
@media (max-width:959px){
  body.inapp .toast{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
  body{padding-block:8px calc(76px + env(safe-area-inset-bottom,0px))}
  .wrap{gap:8px}
  h1{font-size:17px}
  .cols,.left,.right{gap:8px}
  .wrap [data-tab]{display:none}
  body[data-tab="walk"] [data-tab~="walk"],body[data-tab="objects"] [data-tab~="objects"],body[data-tab="notes"] [data-tab~="notes"],body[data-tab="rooms"] [data-tab~="rooms"],body[data-tab="log"] [data-tab~="log"]{display:grid}
  .wrap [data-tab][hidden]{display:none!important}
  .plan{aspect-ratio:auto;height:50dvh;max-height:none}
  .nhint{display:none}
  .vtabs{padding:6px}
  .seg2 button{padding:6px 16px}
  .nhint{font-size:11.5px;padding:4px 10px}
  .wiz{padding:12px;gap:10px;border-radius:12px}
  .wq{font-size:19px}
  .wh{font-size:13px}
  .wpic svg{max-height:96px}
  .winput input{font-size:26px;padding:8px 12px}
  .choices button{padding:12px 6px;font-size:16px}
  .choices button b{font-size:24px}
  .wnav .btn{padding:13px 14px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:6px}
  .tabbar button{font:inherit;font-size:11.5px;font-weight:600;border:0;background:none;color:var(--muted);padding:6px 0;border-radius:10px;display:grid;justify-items:center;gap:2px;cursor:pointer}
  .tabbar button b{font-size:20px;line-height:1}
  .tabbar button[aria-pressed="true"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
}
.sumrow.room{cursor:pointer}
.sumrow.room:hover{background:color-mix(in srgb,var(--chip) 60%,transparent)}
.ceilrow{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ceil{font-family:var(--f-num);font-size:13px;font-weight:600;color:var(--room);background:color-mix(in srgb,var(--room) 10%,transparent);border-radius:7px;padding:3px 8px}
.ed{font-size:12px;color:var(--muted)}
.objbox{display:grid;gap:10px;min-width:0}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cats button{flex:none;font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:99px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.cats button[aria-selected="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.cats button small{font-weight:500;opacity:.7;margin-left:4px}
.addgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.addgrid button{font:inherit;font-size:15px;font-weight:600;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:14px 8px;cursor:pointer;display:grid;gap:4px;justify-items:center}
.addgrid button b{font-size:24px;line-height:1}
.addgrid button:hover{border-color:var(--accent)}
.nrow{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;padding:10px 12px;border-top:1px solid var(--line)}
.nrow .no{font-family:var(--f-num);font-weight:700;color:var(--noteink);background:var(--note);border-radius:99px;width:24px;height:24px;display:grid;place-items:center;font-size:12px}
.nrow .tx{white-space:pre-wrap;word-break:break-word;font-size:14.5px;cursor:pointer}
.nrow .acts{display:flex;gap:6px;grid-column:2}
.nrow .acts button{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.nrow .acts button.del{color:var(--accent)}
.vh{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;z-index:1}
.phbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.phbtn{position:relative;overflow:hidden;text-align:center;padding:12px 10px;font-size:15px;display:block}
.phhelp{font-size:12.5px;color:var(--muted);margin:-6px 0 0}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.phgrid:empty{display:none}
.phgrid.sm{grid-template-columns:repeat(auto-fill,60px);margin-top:8px;white-space:normal}
.nrow .tx{display:grid;grid-template-columns:minmax(0,1fr);min-width:0}
.thumb{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--chip);display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb.missing::after{content:'нет фото';position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:var(--muted)}
.thumb .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:99px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:17px;line-height:1;cursor:pointer}
.pview{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:12px;cursor:zoom-out}
.pview img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.home{max-width:760px;margin:0 auto;display:grid;gap:14px;padding-block:8px 32px}
body.inapp .home{display:none}
body:not(.inapp) .wrap,body:not(.inapp) .tabbar{display:none!important}
.htop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-top:6px}
.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.htitle{font-size:28px;margin:2px 0 0;letter-spacing:-.02em}
.newbtn{font-size:16px;padding:13px 18px;border-radius:12px}
.plist{display:grid;gap:10px}
.pcard{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.pcard:hover{border-color:var(--accent)}
.pthumb{width:72px;height:72px;border-radius:10px;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:9px 9px;display:grid;place-items:center;overflow:hidden}
.pthumb svg{width:62px;height:62px}
.pname{font-weight:700;font-size:16px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.paddr{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:5px;font-size:12.5px;color:var(--muted)}
.pmeta .num{font-family:var(--f-num);color:var(--ink);font-weight:600}
.pmore{border:0;background:none;font-size:22px;color:var(--muted);padding:8px 10px;cursor:pointer;border-radius:8px}
.pmore:hover{background:var(--chip)}
.pempty{background:var(--sheet);border:1px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;display:grid;gap:8px;justify-items:center}
.pempty p{margin:0;color:var(--muted);max-width:42ch}
.hfoot{margin:0;text-align:center}
.backbtn{font-size:26px;padding:2px 14px 6px}
header.top h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 24px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:45;background:var(--ink);color:var(--sheet);padding:10px 14px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast:empty{display:none}
.choose{display:grid;gap:10px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>

const $=id=>document.getElementById(id);
const KEY='obmer-walk-v4';
const N=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:NaN};
const fm=(v,d=2)=>v.toLocaleString(SET.lang==='en'?'en-US':'ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
let SET={unit:'mm',lang:'ru'};try{Object.assign(SET,JSON.parse(localStorage.getItem('obmer-settings')||'{}'));}catch(e){}
function saveSet(){try{localStorage.setItem('obmer-settings',JSON.stringify(SET));}catch(e){}}
const U=()=>SET.unit||'mm';const UL=()=>({mm:'мм',cm:'см',m:'м',ft:''})[U()];
const FR=['','⅛','¼','⅜','½','⅝','¾','⅞'],FRT=['',' 1/8',' 1/4',' 3/8',' 1/2',' 5/8',' 3/4',' 7/8'];
// футы и дюймы с точностью до 1/8″
function ftin(cmv,plain){const neg=cmv<0;let q=Math.round(Math.abs(cmv)/2.54*8);const ft=Math.floor(q/96);q-=ft*96;const wi=Math.floor(q/8),fr=q%8;
  const ins=(wi?String(wi):(fr?'':'0'))+(plain?(wi?FRT[fr]:FRT[fr].trim()):FR[fr]);const s=ft?`${ft}' ${ins}"`:`${ins}"`;return (neg?'−':'')+s.replace(`' 0"`,`'`);}
// разбор ввода: 126 (дюймы), 10' 6", 10 6, 10' 6 1/4", 6 1/2, 3.5'
function parseFtIn(str){str=String(str||'').trim().replace(/,/g,'.').replace(/[″”]/g,'"').replace(/[′’]/g,"'");if(!str)return NaN;
  let ft=0,inch=0,m;
  const fm1=str.match(/^(-?\d+(?:\.\d+)?)\s*(?:'|ft|фт)\s*(.*)$/i);if(fm1){ft=parseFloat(fm1[1]);str=fm1[2].trim();}
  str=str.replace(/\s*(?:"|in|дюйм\S*)\s*$/i,'').trim();
  if(str){const t=str.split(/\s+/);
    if(!fm1&&t.length>=2&&!t[1].includes('/')){ft=parseFloat(t[0]);t.shift();}
    for(const x of t){if(x.includes('/')){const [a,b]=x.split('/').map(Number);if(!(b>0))return NaN;inch+=a/b;}else{const n=parseFloat(x);if(!isFinite(n))return NaN;inch+=n;}}}
  const tot=ft*12+inch;return isFinite(tot)?tot*2.54:NaN;}
const cm=v=>U()==='ft'?ftin(v):U()==='m'?fm(v/100,2):String(Math.round(U()==='mm'?v*10:v));
const IM=()=>U()==='ft'?'text':'decimal';
const ULin=()=>U()==='ft'?'дюйм':UL();
const AR=c2=>U()==='ft'?fm(c2/929.0304,1)+' ft²':fm(c2/1e4)+' м²';
const PL=c=>U()==='ft'?fm(c/30.48,1)+' ft':fm(c/100)+' м';
const LEN=new Set(['l','w','h','t','s','ch','z','dep','d','fd']);
const toU=v=>{const n=N(v);if(!isFinite(n))return '';if(U()==='ft')return ftin(n,true);return U()==='m'?String(Math.round(n)/100):String(Math.round((U()==='mm'?n*10:n)*10)/10);};
const fromU=n=>U()==='mm'?n/10:U()==='m'?n*100:U()==='ft'?n*2.54:n;
const UIN=v=>U()==='ft'?parseFtIn(v):fromU(N(v));
const iv=v=>N(v)>=0?cm(N(v)):'?';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function sample(){return{start:{name:'Прихожая',ch:'270',w:'90',h:'205',t:'40',hand:'R',hinge:0,out:1},sel:-1,steps:[
 {k:'corner',l:'170',d:'L'},{k:'corner',l:'150',d:'L'},
 {k:'door',l:'30',w:'80',h:'200',t:'12',enter:true,name:'Кухня',ch:'270'},
   {k:'corner',l:'130',d:'L'},{k:'win',l:'80',w:'140',h:'150',s:'85'},{k:'corner',l:'80',d:'L'},
   {k:'corner',l:'250',d:'L'},{k:'corner',l:'300',d:'L'},{k:'exit',l:'40'},
 {k:'door',l:'52',w:'80',h:'200',t:'12',enter:true,name:'Комната',ch:'270'},
   {k:'corner',l:'0',d:'L'},{k:'corner',l:'400',d:'L'},{k:'win',l:'90',w:'160',h:'150',s:'80'},
   {k:'corner',l:'88',d:'L'},{k:'corner',l:'400',d:'L'},{k:'exit',l:'258'},
 {k:'corner',l:'58',d:'L'},{k:'corner',l:'150',d:'L'},{k:'exit',l:'40'}]}}
/* ================= замеры (проекты) ================= */
const PKEY='obmer-projects-v1';
const newId=()=>'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const blankS=u=>({unit:u||'mm',start:{name:'Прихожая',ch:'270',w:'',h:'205',t:'',hand:'R',hinge:0,out:1},sel:null,steps:[]});
let P=null;try{P=JSON.parse(localStorage.getItem(PKEY));}catch(e){}
if(!P||!Array.isArray(P.list))P={list:[],cur:null};
if(!P.list.length){let old=null;try{old=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  if(old&&old.steps&&(old.steps.length>0||(old.notes||[]).length)){P.list.push({id:newId(),name:'Мой первый замер',addr:'',client:'',created:Date.now(),updated:Date.now(),S:old});}}
let S=null;
const curProj=()=>P.list.find(p=>p.id===P.cur);
function saveP(){try{localStorage.setItem(PKEY,JSON.stringify(P));}catch(e){}}
function save(){const p=curProj();if(!p||!S)return;p.S=S;p.updated=Date.now();
  if(G){p.rooms=G.rooms.filter(R=>R.closed).length;p.area=Math.round(G.rooms.reduce((a,R)=>a+(R.closed?R.area-(R.boxArea||0):0),0));p.done=!!G.done;
    p.thumb=G.rooms.filter(R=>R.closed&&R.poly.length>2).map(R=>R.poly.map(q=>[Math.round(q[0]),Math.round(q[1])]));}
  saveP();}

/* ================= геометрия ================= */
function build(){
  const add=(p,v,k)=>[p[0]+v[0]*k,p[1]+v[1]*k];
  const st=S.start||{},hand=st.hand==='L'?-1:1;
  const dir=a=>{const r=a*Math.PI/180;return {d:[Math.cos(r),Math.sin(r)],r:[hand*Math.sin(r),-hand*Math.cos(r)]};};
  const t0=N(st.t)||12;
  const root={name:st.name||'Прихожая',h:N(st.ch),t:t0,start:[0,0],expect:[0,0],pts:[[0,0]],segs:[],depth:0,closed:false};
  const rooms=[root],segs=[],info=[];let cur=root,p=[0,0],a=0;const stack=[];
  const seg=(k,len,s,i)=>{const {d,r}=dir(a);const q=add(p,d,len);const g={k,i,a0:p,b:q,len,heading:a,d,r,room:cur,s};cur.segs.push(g);segs.push(g);cur.pts.push(q);p=q;return g;};
  // входная дверь
  const W0=N(st.w);
  if(W0>0)root.entry=seg('door',W0,{h:st.h,t:st.t,hinge:st.hinge,out:st.out},-1);
  S.steps.forEach((s,i)=>{
    const inf={room:cur,depth:cur.depth,bad:''};info[i]=inf;
    const L=N(s.l);
    if(!(L>=0)){inf.bad='нет расстояния';return;}
    if(L>0)inf.wall=seg('wall',L,s,i);
    if(s.k==='corner'){a+=(s.d==='L'?1:-1)*(N(s.a)||90);inf.corner=p;}
    else if(s.k==='win'||s.k==='door'){
      const w=N(s.w);if(!(w>0)){inf.bad='нет ширины';return;}
      const qStart=p;const g=seg(s.k,w,s,i);inf.seg=g;
      if(s.k==='door'&&s.enter){
        const {r}=dir(a),t=N(s.t)||cur.t;
        const child={name:s.name||'Комната',h:N(s.ch)||cur.h,t,start:add(qStart,r,t),expect:add(g.b,r,t),segs:[],depth:cur.depth+1,parent:cur,door:g,closed:false};
        child.pts=[child.start];g.child=child;rooms.push(child);
        stack.push({room:cur,p:g.b,a});cur=child;p=child.start;a+=180;inf.child=child;
      }
    } else if(s.k==='exit'){
      cur.end=p;cur.closed=true;inf.exited=cur;
      if(stack.length){const fr=stack.pop();cur=fr.room;p=fr.p;a=fr.a;inf.back=cur;}
      else {inf.done=true;}
    }
  });
  if(!cur.closed)cur.end=p;
  rooms.forEach(R=>{
    if(!R.end)R.end=R.pts[R.pts.length-1];
    R.err=Math.hypot(R.end[0]-R.expect[0],R.end[1]-R.expect[1]);
    R.open=!R.closed;
    // замкнутую комнату подтягиваем к двери: углы не трогаем, меняем только длины стен
    // (поправка по методу наименьших квадратов: длинные стены берут на себя больше)
    if(R.closed&&R.err>0.3&&R.segs.length){
      const E=[R.end[0]-R.expect[0],R.end[1]-R.expect[1]];
      const adj=R.segs.filter(g=>g.k==='wall'&&g.len>1);
      let a=0,b=0,c=0;adj.forEach(g=>{a+=g.len*g.d[0]*g.d[0];b+=g.len*g.d[0]*g.d[1];c+=g.len*g.d[1]*g.d[1];});
      const det=a*c-b*b;
      if(adj.length&&Math.abs(det)>1e-6){
        const lx=(c*E[0]-b*E[1])/det,ly=(a*E[1]-b*E[0])/det;
        adj.forEach(g=>{g.dl=-g.len*(g.d[0]*lx+g.d[1]*ly);});
        let p=R.start;R.segs.forEach(g=>{const L=Math.max(0.5,g.len+(g.dl||0));g.a0=p;g.b=[p[0]+g.d[0]*L,p[1]+g.d[1]*L];p=g.b;});
      } else {
        const tot=R.segs.reduce((s,g)=>s+g.len,0);let cc=0;
        R.segs.forEach(g=>{const k0=cc/tot;cc+=g.len;const k1=cc/tot;g.a0=[g.a0[0]-E[0]*k0,g.a0[1]-E[1]*k0];g.b=[g.b[0]-E[0]*k1,g.b[1]-E[1]*k1];});
      }
      R.pts=[R.start].concat(R.segs.map(g=>g.b));R.end=R.pts[R.pts.length-1];R.fixed=true;
    }
    const P=R.pts.slice();if(!R.fixed&&R.err>0.5)P.push(R.expect);if(R.fixed)P.pop();if(R.err>0.5)P.push(R.expect);if(R.depth>0)P.push(R.start);
    R.poly=P;
    let s2=0,cx=0,cy=0;for(let k=0;k<P.length;k++){const A=P[k],B=P[(k+1)%P.length],c=A[0]*B[1]-B[0]*A[1];s2+=c;cx+=(A[0]+B[0])*c;cy+=(A[1]+B[1])*c;}
    R.area=Math.abs(s2)/2;R.c=s2?[cx/(3*s2),cy/(3*s2)]:P[0];
    R.per=0;for(let k=0;k<P.length;k++){const A=P[k],B=P[(k+1)%P.length];R.per+=Math.hypot(B[0]-A[0],B[1]-A[1]);}
    let op=0;R.segs.forEach(g=>{if(g.k!=='wall')op+=g.len*(N(g.s.h)||0);});if(R.door)op+=R.door.len*(N(R.door.s.h)||0);
    R.wallArea=R.h>0?Math.max(0,R.per*R.h-op):NaN;
    R.wins=R.segs.filter(g=>g.k==='win').length;R.doors=R.segs.filter(g=>g.k==='door').length+(R.door?1:0);
  });
  return {rooms,segs,info,cur,p,a,done:root.closed,inRoot:cur===root};
}

/* ================= план ================= */
function drawPlan(G){
  const svg=$('plan');let xs=[],ys=[];
  G.rooms.forEach(R=>R.poly.forEach(p=>{xs.push(p[0]);ys.push(-p[1]);}));
  xs.push(G.p[0]);ys.push(-G.p[1]);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const span=Math.max(maxX-minX,maxY-minY,150),pad=span*0.1+30;
  const vb=[minX-pad,minY-pad,maxX-minX+2*pad,maxY-minY+2*pad];
  const fs=Math.max(span/34,8);
  const P=p=>`${p[0].toFixed(1)},${(-p[1]).toFixed(1)}`;
  const off=(p,v,k)=>[p[0]+v[0]*k,p[1]+v[1]*k];
  let o='';
  const ok=R=>R.closed&&R.poly.length>2;
  // стены: каждая полоса идёт наружу от внутренней линии; между комнатами — ровно по зазору
  const quad=(a,b,c,d,f)=>`<polygon points="${[a,b,c,d].map(P).join(' ')}" fill="${f}"/>`;
  G.segs.forEach(g=>g.pieces.forEach(pc=>{const A=off(g.a0,g.u,pc.s),B=off(g.a0,g.u,pc.e);o+=quad(A,B,off(B,g.n,pc.t),off(A,g.n,pc.t),'var(--wall)');}));
  G.rooms.forEach(R=>{const L=R.segs;for(let k=0;k<L.length;k++){
    const g=L[k],h=k<L.length-1?L[k+1]:(R.depth===0&&R.closed?L[0]:null);if(!h||g===h)continue;
    if(Math.hypot(g.b[0]-h.a0[0],g.b[1]-h.a0[1])>1)continue;
    const cr=g.u[0]*h.u[1]-g.u[1]*h.u[0];if(Math.abs(cr)<0.05)continue;
    const V=g.b,P1=off(V,g.n,g.t1),P3=off(V,h.n,h.t0);
    const a=((P3[0]-P1[0])*h.u[1]-(P3[1]-P1[1])*h.u[0])/cr;let X=off(P1,g.u,a);
    if(Math.hypot(X[0]-V[0],X[1]-V[1])>200)X=off(P1,h.n,h.t0);
    o+=quad(V,P1,X,P3,'var(--wall)');}});
  const wet=n=>/ванн|санузел|туалет|с\/у|душ|кухн|балкон|лодж/i.test(n);
  G.rooms.forEach(R=>{if(ok(R)){const pts=R.poly.map(P).join(' ');o+=`<polygon points="${pts}" fill="var(--floor)"/><polygon points="${pts}" fill="url(#${wet(R.name)?'flTile':'flWood'})"/>`;}});
  // толщина перегородок между комнатами
  G.segs.forEach(g=>g.pieces.forEach(pc=>{if(!pc.nb||pc.nb===g.room||G.rooms.indexOf(pc.nb)<G.rooms.indexOf(g.room))return;
    const f=Math.min(fs*0.55,pc.t*0.85);if(f<fs*0.3||pc.e-pc.s<fs*2.5)return;
    const m=off(off(g.a0,g.u,(pc.s+pc.e)/2),g.n,pc.t/2);let ang=-Math.atan2(g.u[1],g.u[0])*180/Math.PI;if(ang>90)ang-=180;if(ang<-90)ang+=180;
    o+=`<text transform="translate(${m[0].toFixed(1)},${(-m[1]).toFixed(1)}) rotate(${ang.toFixed(1)})" text-anchor="middle" dominant-baseline="central" font-family="var(--f-num)" font-weight="600" font-size="${f}" fill="var(--floor)">${cm(pc.t)}</text>`;}));
  G.rooms.forEach(R=>{if(R.err>2&&R.closed&&!R.fixed){o+=`<line x1="${R.end[0]}" y1="${-R.end[1]}" x2="${R.expect[0]}" y2="${-R.expect[1]}" stroke="var(--accent)" stroke-width="${fs*0.25}" stroke-dasharray="${fs*0.6} ${fs*0.5}"/>`;}});
  G.segs.forEach(g=>{
    if(g.k==='wall')return;

      [0.4,0.6].forEach(k=>{const p1=off(g.a0,g.r,tw*k),p2=off(g.b,g.r,tw*k);o+=`<line x1="${p1[0]}" y1="${-p1[1]}" x2="${p2[0]}" y2="${-p2[1]}" stroke="var(--wall)" stroke-width="${fs*0.06}"/>`;});

    }

    // откосы (толщина проёма)

    const into=(g.child?1:0)^(g.s.out?1:0);

    o+=`<g data-note="${j}" style="cursor:pointer"><circle cx="${x}" cy="${y-r*1.6}" r="${r*2}" fill="transparent"/><path d="M${x},${y} l${-r*0.7},${-r*1.1} a${r},${r} 0 1 1 ${r*1.4},0 z" fill="var(--note)" stroke="${sel?'var(--accent)':'var(--noteink)'}" stroke-width="${fs*(sel?0.16:0.07)}"/><text x="${x}" y="${y-r*1.75}" text-anchor="middle" dominant-baseline="central" font-family="var(--f-num)" font-weight="700" font-size="${r*0.95}" fill="var(--noteink)">${j+1}</text></g>`;});

    let ang=((-g.heading%360)+540)%360-180;if(ang>90)ang-=180;if(ang<-90)ang+=180;

    o+=`<text transform="translate(${m[0].toFixed(1)},${(-m[1]).toFixed(1)}) rotate(${ang})" text-anchor="middle" dominant-baseline="central" font-family="var(--f-num)" font-size="${fs*0.62}" fill="${col}">${cm(g.len)}</text>`;

/* ================= вид на стену (лицом к стене, левый угол слева) ================= */
function drawElev(G){
  let run=null,selSeg=null,selIt=null;

  else{const si=S.sel===-1?{seg:G.rooms[0].entry}:(S.sel!=null?G.info[S.sel]:null);selSeg=si&&(si.seg||si.wall);if(selSeg&&G.runs)run=G.runs.find(r=>r.segs.includes(selSeg));}

  let o=`<rect x="0" y="0" width="${Wd}" height="${H}" fill="var(--floor)" stroke="var(--wall)" stroke-width="${fs*0.15}"/>`;
  const els=run.segs.map(g=>({k:g.k,x0:run.pj(g.a0),w:run.pj(g.b)-run.pj(g.a0),s:g.s,len:g.len,g}));
  if(run.gap&&run.gap.s)els.push({k:'door',x0:run.pj(run.gap.a),w:run.pj(run.gap.b)-run.pj(run.gap.a),s:run.gap.s,len:run.pj(run.gap.b)-run.pj(run.gap.a)});
  els.forEach(e=>{
    const x=X(e.x0,e.w),sel=selSeg&&e.g===selSeg,sw=fs*(sel?0.25:0.1),sc=sel?'var(--accent)':'var(--wall)';
    if(e.k==='win'){const s=N(e.s.s)||0,h=N(e.s.h)||0;
      o+=`<rect x="${x}" y="${H-s-h}" width="${e.w}" height="${h}" fill="var(--glass)" stroke="${sc}" stroke-width="${sw}"/>`;
      if(s>0)o+=T(x+e.w/2,H-s/2,cm(s),'var(--room)');}
    if(e.k==='door'){const h=N(e.s.h)||0;
      o+=`<rect x="${x}" y="${H-h}" width="${e.w}" height="${h}" fill="color-mix(in srgb,var(--accent) 14%,var(--floor))" stroke="${sc}" stroke-width="${sw}"/>`;
      if(h>0)o+=T(x+e.w/2,H-h/2,cm(h));}
    if(e.k==='wall'&&sel)o+=`<rect x="${x}" y="0" width="${e.w}" height="${H}" fill="color-mix(in srgb,var(--accent) 10%,transparent)"/>`;
    o+=T(x+e.w/2,H+fs*1.1,cm(e.len),sel?'var(--accent)':'var(--muted)');
    o+=`<line x1="${x}" y1="${H}" x2="${x}" y2="${H+fs*0.4}" stroke="var(--muted)" stroke-width="${fs*0.06}"/>`;
  });
  // объекты на этой стене
  G.items.forEach(xi=>{if(xi.run!==run)return;
    const it=xi.it,sel=selIt===xi,sc=sel?'var(--accent)':null,sw=fs*(sel?0.2:0.08);
    const w=N(it.w)||0,h=N(it.h)||0,z=N(it.z)||0,xc=run.flip?Wd-xi.pc:xi.pc,xl=X(xi.p0,w);
    if(it.type==='beam'){const bx=X(xi.p0,xi.bw);o+=`<rect x="${bx}" y="0" width="${xi.bw}" height="${h}" fill="url(#hatchE)" stroke="${sc||'var(--wall)'}" stroke-width="${sw}" stroke-dasharray="${fs*0.4} ${fs*0.25}"/>`;}
    if(it.type==='box')o+=`<rect x="${xl}" y="${H-h}" width="${w}" height="${h}" fill="url(#hatchE)" stroke="${sc||'var(--wall)'}" stroke-width="${sw}"/>`;

      const nf=Math.min(Math.floor(w/8),30);for(let k=1;k<nf;k++)o+=`<line x1="${xl+w*k/nf}" y1="${H-z-h+3}" x2="${xl+w*k/nf}" y2="${H-z-3}" stroke="var(--heat)" stroke-width="${fs*0.05}"/>`;}
    if(['cw','hw','sw'].includes(it.type)){const rr=Math.max((N(it.dia)||2)/2,2.5);o+=`<circle cx="${xc}" cy="${H-z}" r="${rr}" fill="${PIPE[it.type]}" stroke="${sc||'var(--sheet)'}" stroke-width="${Math.max(sw,0.6)}"/>`+T(xc,H-z-rr-fs*0.6,ICON[it.type],PIPE[it.type]);}
    if(it.type==='riser'){const rr=Math.max((N(it.dia)||2.5)/2,1.5);o+=`<rect x="${xc-rr}" y="0" width="${rr*2}" height="${H}" fill="${PIPE[it.kind]||PIPE.cw}" opacity=".85" stroke="${sc||'none'}" stroke-width="${sw}"/>`;}

    if(it.type==='furn'){o+=`<rect x="${xl}" y="${H-h}" width="${w}" height="${h}" fill="color-mix(in srgb,#b98b5e 18%,var(--floor))" stroke="${sc||'#8a6a48'}" stroke-width="${sw}"/>`+T(xl+w/2,H-h/2,esc(it.name||'Мебель'),'#7a5a3a');}
    if(it.type==='bath'){o+=`<rect x="${xl}" y="${H-h}" width="${w}" height="${h}" rx="4" fill="var(--sheet)" stroke="${sc||'var(--ink)'}" stroke-width="${sw}"/>`;}
    if(it.type==='sink'){o+=`<path d="M${xc-w/2},${H-z} h${w} l${-w*0.12},16 h${-w*0.76} z" fill="var(--sheet)" stroke="${sc||'var(--ink)'}" stroke-width="${sw}"/><rect x="${xc-w*0.12}" y="${H-z+16}" width="${w*0.24}" height="${Math.max(z-16,0)}" fill="var(--sheet)" stroke="${sc||'var(--ink)'}" stroke-width="${sw}"/><path d="M${xc},${H-z} v-14 h8" fill="none" stroke="var(--muted)" stroke-width="${fs*0.12}"/>`;}
    if(it.type==='switch'){const n=Math.max(1,Math.min(3,Math.round(N(it.n)||1))),a=8;o+=`<rect x="${xc-a/2}" y="${H-z-a/2}" width="${a}" height="${a}" rx="1" fill="var(--sheet)" stroke="${sc||'var(--elec)'}" stroke-width="${Math.max(sw,0.6)}"/>`;for(let k=1;k<n;k++)o+=`<line x1="${xc-a/2+a*k/n}" y1="${H-z-a/2+1}" x2="${xc-a/2+a*k/n}" y2="${H-z+a/2-1}" stroke="var(--elec)" stroke-width="0.6"/>`;}
    if(it.type==='wc'&&it.var==='inst'){const fw=Math.max((w||38)*1.5,60),bw=w||38;o+=`<rect x="${xc-fw/2}" y="${H-120}" width="${fw}" height="120" fill="url(#hatchE)" stroke="${sc||'var(--wall)'}" stroke-width="${sw}"/><rect x="${xc-12}" y="${H-108}" width="24" height="15" rx="2" fill="var(--sheet)" stroke="var(--muted)" stroke-width="0.8"/><path d="M${xc-bw*0.45},${H-42} h${bw*0.9} q0,18 ${-bw*0.3},20 h${-bw*0.3} q${-bw*0.3},-2 ${-bw*0.3},-20 z" fill="var(--sheet)" stroke="${sc||'var(--ink)'}" stroke-width="${sw}"/>`;}
    else if(it.type==='wc'){const bw=w||38;o+=`<rect x="${xc-bw/2}" y="${H-80}" width="${bw}" height="38" rx="3" fill="var(--sheet)" stroke="${sc||'var(--ink)'}" stroke-width="${sw}"/><path d="M${xc-bw*0.45},${H-40} h${bw*0.9} l${-bw*0.12},40 h${-bw*0.66} z" fill="var(--sheet)" stroke="${sc||'var(--ink)'}" stroke-width="${sw}"/>`;}
    if(it.type==='outlet'){const n=Math.max(1,Math.min(6,Math.round(N(it.n)||1))),a=7.1;

    if(sel){const ref=CENTER.has(it.type)?xc:xl,yy=it.type==='outlet'||it.type==='rad'?H-z-(it.type==='rad'?h:0)-fs*0.8:H-(it.type==='box'?h:80)-fs*0.8;

/* ================= список и итоги ================= */
function describe(s,inf){
  const L=N(s.l),Ls=L>0?`${cm(L)} ${UL()}`:'сразу';
  if(s.k==='corner'&&s.jog){const nm=s.jog==='niche'?'ниша':'выступ';return [[`${Ls} до края — ${nm}`,`${nm}: глубина ${cm(N(s.l))}`,`${nm}: ширина ${cm(N(s.l))}`,`${nm}: обратно ${cm(N(s.l))}`][s.jk||0],'поворот '+(s.d==='L'?'налево':'направо')];}
  if(s.k==='corner')return [`${Ls} до угла, поворот ${s.d==='L'?'налево':'направо'}${N(s.a)&&N(s.a)!==90?' на '+Math.round(N(s.a))+'°':''}`,''];
  if(s.k==='win')return [`${Ls} до окна`,`окно ${iv(s.w)}×${iv(s.h)}, подоконник ${iv(s.s)} от пола`];
  if(s.k==='door')return [`${Ls} до двери`+(s.enter?` → захожу в «${esc(s.name||'Комната')}»`:', иду мимо'),`проём ${iv(s.w)}×${iv(s.h)}, толщина стены ${iv(s.t)}`];
  if(s.k==='exit'){const r=inf&&inf.exited;return [`${Ls} до двери, через которую вошёл`,r?(inf.done?'обход закончен':`выхожу из «${esc(r.name)}» в «${esc(inf.back.name)}»`):''];}
  return ['',''];
}
function renderLog(G){
  const st=S.start;let o='';
  o+=`<div class="roomlbl">${esc(st.name||'Прихожая')}</div>`;
  o+=`<button class="it ${S.sel===-1?'sel':''}" data-i="-1"><span class="no">0</span><span class="tx"><b>Входная дверь ${iv(st.w)}×${iv(st.h)}</b><small>толщина стены ${iv(st.t)} · стена ${st.hand==='L'?'слева':'справа'} · потолок ${iv(st.ch)}</small></span><span class="ed">изменить</span></button>`;
  S.steps.forEach((s,i)=>{
    const inf=G.info[i]||{},[t1,t2]=describe(s,inf);
    o+=`<button class="it ind ${i===S.sel?'sel':''} ${inf.bad?'bad':''}" style="--d:${inf.depth||0}" data-i="${i}"><span class="no">${i+1}</span><span class="tx"><b>${t1}</b><small>${inf.bad?'⚠ '+inf.bad:t2}</small></span><span class="ed">изменить</span></button>`;
    if(inf.child)o+=`<div class="roomlbl ind" style="--d:${inf.depth+1}">${esc(inf.child.name)}</div>`;
  });
  $('log').innerHTML=o;$('logT').textContent=`Все замеры (${S.steps.length+1}) — нажмите, чтобы исправить`;
}
function renderSum(G){
  let o='',tot=0;

    const pill=R.open?`<span class="pill warn">в процессе</span>`:R.err<=2?`<span class="pill ok">сошлось</span>`:`<span class="pill warn">расхождение ${cm(R.err)} ${UL()}</span>`;

function wallBands(G){
  const S2=G.segs;
  S2.forEach(g=>{const dx=g.b[0]-g.a0[0],dy=g.b[1]-g.a0[1],L=Math.hypot(dx,dy)||1;g.L=L;g.u=[dx/L,dy/L];
    let n=[g.u[1],-g.u[0]];if(n[0]*g.r[0]+n[1]*g.r[1]<0)n=[-n[0],-n[1]];g.n=n;});
  // толщина по умолчанию: если на этой прямой стене есть дверь — берём толщину, замеренную в её проёме
  G.rooms.forEach(R=>{let run=[];const flush=()=>{const d=run.find(g=>g.k==='door'&&N(g.s.t)>0);run.forEach(g=>g.def=d?N(d.s.t):R.t);run=[];};
    R.segs.forEach((g,k)=>{const pr=R.segs[k-1];if(pr&&!(Math.abs(pr.heading-g.heading)<0.01&&Math.hypot(pr.b[0]-g.a0[0],pr.b[1]-g.a0[1])<1))flush();run.push(g);});flush();});
  S2.forEach(g=>{
    const def=g.def||g.room.t,ivs=[];
    S2.forEach(f=>{if(f===g)return;
      if(g.n[0]*f.n[0]+g.n[1]*f.n[1]>-0.97)return;
      const d=(f.a0[0]-g.a0[0])*g.n[0]+(f.a0[1]-g.a0[1])*g.n[1];if(!(d>1&&d<=90))return;
      const p1=(f.a0[0]-g.a0[0])*g.u[0]+(f.a0[1]-g.a0[1])*g.u[1],p2=(f.b[0]-g.a0[0])*g.u[0]+(f.b[1]-g.a0[1])*g.u[1];
      const s=Math.max(0,Math.min(p1,p2)),e=Math.min(g.L,Math.max(p1,p2));if(e-s>1)ivs.push({s,e,d,room:f.room});});
    const cuts=[0,g.L];ivs.forEach(v=>cuts.push(v.s,v.e));cuts.sort((a,b)=>a-b);
    const pcs=[];
    for(let k=0;k<cuts.length-1;k++){const s=cuts[k],e=cuts[k+1];if(e-s<0.5)continue;const m=(s+e)/2;
      let best=null;ivs.forEach(v=>{if(v.s<=m&&v.e>=m&&(!best||v.d<best.d))best=v;});
      const t=best?best.d:def,nb=best?best.room:null,last=pcs[pcs.length-1];
      if(last&&Math.abs(last.t-t)<0.01&&last.nb===nb)last.e=e;else pcs.push({s,e,t,nb});}
    if(!pcs.length)pcs.push({s:0,e:g.L,t:def,nb:null});
    g.pieces=pcs;g.t0=pcs[0].t;g.t1=pcs[pcs.length-1].t;g.th=Math.max(...pcs.map(p=>p.t));
  });
  // перегородки между комнатами
  const pairs={};
  S2.forEach(g=>g.pieces.forEach(pc=>{if(!pc.nb||pc.nb===g.room)return;
    const a=g.room.name,b=pc.nb.name,key=[a,b].sort().join(' — ');const L=pc.e-pc.s;
    const v=pairs[key]||(pairs[key]={sum:0,len:0,min:1e9,max:0});v.sum+=pc.t*L;v.len+=L;v.min=Math.min(v.min,pc.t);v.max=Math.max(v.max,pc.t);}));
  G.parts=Object.entries(pairs).map(([k,v])=>({k,t:v.sum/v.len,min:v.min,max:v.max}));
}

/* ================= стены целиком и объекты в комнатах ================= */
const ITYPE={box:'Короб',beam:'Балка',cw:'Холодная вода',hw:'Горячая вода',sw:'Канализация',riser:'Стояк',vent:'Вентиляция',outlet:'Розетка',switch:'Выключатель',panel:'Электрощиток',wc:'Унитаз',sink:'Раковина',bath:'Ванна',rad:'Батарея'};
const ICON={box:'▨',beam:'═',cw:'Х',hw:'Г',sw:'К',riser:'◉',vent:'▦',outlet:'⊙',switch:'⊘',panel:'Щ',wc:'◡',sink:'◒',bath:'▭',rad:'▥'};
const CENTER=new Set(['outlet','switch','wc','sink','cw','hw','sw','riser']);
const CATS=[['constr','Конструкции',['box','beam']],['water','Вода и вентиляция',['cw','hw','sw','riser','vent']],['elec','Электрика',['outlet','switch','panel']],['plumb','Сантехника',['wc','sink','bath','rad']]];
const PIPE={cw:'#1c7ed6',hw:'#e03131',sw:'#868e96',heat:'#f08c00'};
const KINDN={cw:'ХВС',hw:'ГВС',sw:'Канализация',heat:'Отопление'};
const DIAS={cw:[16,20,25,32],hw:[16,20,25,32],sw:[50,110],heat:[20,25,32]};
const FURN=[['Шкаф',100,60,220],['Кухня',240,60,90],['Холодильник',60,65,185],['Кровать',160,200,50],['Диван',200,90,85],['Стол',120,70,75],['Тумба',50,40,50],['Стиральная машина',60,60,85],['Другое',80,60,100]];
const catOf=t=>(CATS.find(c=>c[2].includes(t))||CATS[0])[0];
const DEFCAT='constr';
const sameH=(a,b)=>{const d=(((a-b)%360)+360)%360;return d<0.01||d>359.99;};
function computeRuns(G){
  G.runs=[];
  G.rooms.forEach(R=>{
    const runs=[];let cur=null;
    R.segs.forEach((g,k)=>{const pr=R.segs[k-1];
      if(!cur||!(pr&&sameH(pr.heading,g.heading)&&Math.hypot(pr.b[0]-g.a0[0],pr.b[1]-g.a0[1])<1)){cur={room:R,segs:[]};runs.push(cur);}
      cur.segs.push(g);});
    // у дочерней комнаты стена с её дверью разбита проёмом — склеиваем
    if(R.depth>0&&R.closed&&runs.length>1){
      const f=runs[0],l=runs[runs.length-1],g0=f.segs[0],gl=l.segs[l.segs.length-1];
      if(sameH(g0.heading,gl.heading)&&Math.hypot(g0.a0[0]-R.start[0],g0.a0[1]-R.start[1])<1){
        f.segs=l.segs.concat(f.segs);f.gap={a:gl.b,b:g0.a0,s:R.door&&R.door.s};runs.pop();}
    }
    runs.forEach(r=>{const g0=r.segs[0],gl=r.segs[r.segs.length-1];
      r.key=r.gap?r.segs.find(g=>g.a0===r.gap.b).i:g0.i;
      r.a=g0.a0;r.b=gl.b;const dx=r.b[0]-r.a[0],dy=r.b[1]-r.a[1];r.L=Math.hypot(dx,dy)||1;r.u=[dx/r.L,dy/r.L];r.n=g0.n;
      const left=[-r.n[1],r.n[0]];r.flip=r.u[0]*left[0]+r.u[1]*left[1]>0;
      r.pj=p=>(p[0]-r.a[0])*r.u[0]+(p[1]-r.a[1])*r.u[1];
      G.runs.push(r);});
    R.runs=runs;
  });
}
function resolveItems(G){
  S.items=(S.items||[]).filter(it=>ITYPE[it.type]);
  G.rooms.forEach(R=>R.boxArea=0);
  G.items=S.items.map((it,j)=>{
    const run=G.runs.find(r=>r.key===it.key)||null;const o={it,j,run};if(!run)return o;
    const d=N(it.d)||0,w=N(it.w)||0,L=run.L;
    if(CENTER.has(it.type)){o.pc=run.flip?L-d:d;o.p0=o.pc-w/2;}
    else{o.p0=run.flip?L-d-w:d;o.pc=o.p0+w/2;}
    if(it.type==='box')run.room.boxArea+=w*(N(it.dep)||0);
    if(it.type==='beam'){
      if(it.dir==='along'){o.p0=0;o.pc=L/2;o.bw=L;o.bl=w;}
      else{o.bw=w;const R=run.room,m=[-run.n[0],-run.n[1]],P0=[run.a[0]+run.u[0]*o.pc,run.a[1]+run.u[1]*o.pc];let best=1e9;
        const poly=R.poly&&R.poly.length>2?R.poly:[];
        for(let k=0;k<poly.length;k++){const A=poly[k],B=poly[(k+1)%poly.length],e=[B[0]-A[0],B[1]-A[1]],den=m[0]*e[1]-m[1]*e[0];if(Math.abs(den)<1e-9)continue;
          const t=((A[0]-P0[0])*e[1]-(A[1]-P0[1])*e[0])/den,s2=((A[0]-P0[0])*m[1]-(A[1]-P0[1])*m[0])/den;if(t>2&&s2>=-0.01&&s2<=1.01)best=Math.min(best,t);}
        o.bl=best<1e8?best:200;}
    }
    return o;});
}

/* рисунок объектов на плане */
function drawItems(G,fs,P,off){
  let o='';
  G.items.forEach(x=>{if(!x.run)return;
    const r=x.run,it=x.it,m=[-r.n[0],-r.n[1]],sel=S.selItem===x.j;
    const at=(p,dn)=>off(off(r.a,r.u,p),m,dn);
    const stroke=sel?'var(--accent)':null,sw=fs*(sel?0.18:0.09);
    const w=N(it.w)||0,dep=N(it.dep)||0;
    if(it.type==='beam'){

function inPoly(pt,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if((a[1]>pt[1])!==(b[1]>pt[1])&&pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0])c=!c;}return c;}
function roomAt(pt){return G.rooms.find(R=>R.closed&&R.poly.length>2&&inPoly(pt,R.poly))||null;}

const PDB={db:null,
  open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);try{const r=indexedDB.open('obmer-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>{this.db=r.result;res(this.db);};r.onerror=()=>rej(r.error);}catch(e){rej(e);}});},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('p',mode),st=t.objectStore('p');const q=fn(st);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);});},
  put(id,b){return this.tx('readwrite',st=>st.put(b,id));},get(id){return this.tx('readonly',st=>st.get(id));},del(id){return this.tx('readwrite',st=>st.delete(id)).catch(()=>{});}};
const PURL={};
async function photoURL(id){if(PURL[id])return PURL[id];try{const b=await PDB.get(id);if(b){PURL[id]=URL.createObjectURL(b);return PURL[id];}}catch(e){}return null;}

async function shrink(file){try{const bm=await createImageBitmap(file);const k=Math.min(1,1600/Math.max(bm.width,bm.height));const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
  c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.82));}catch(e){return file;}}

let PB=[0,0,100,100];const PZ={k:1,x:0,y:0};
function applyVB(){const w=PB[2]/PZ.k,h=PB[3]/PZ.k,cx=PB[0]+PB[2]/2+PZ.x,cy=PB[1]+PB[3]/2+PZ.y;$('plan').setAttribute('viewBox',`${(cx-w/2).toFixed(1)} ${(cy-h/2).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);}
function toSvg(px,py){const svg=$('plan'),p=svg.createSVGPoint();p.x=px;p.y=py;const m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:0,y:0};}
function zoomAt(px,py,f){const a=toSvg(px,py);PZ.k=Math.min(12,Math.max(0.6,PZ.k*f));applyVB();const b=toSvg(px,py);PZ.x+=a.x-b.x;PZ.y+=a.y-b.y;applyVB();}
function panPx(dx,dy){const a=toSvg(0,0),b=toSvg(dx,dy);PZ.x-=b.x-a.x;PZ.y-=b.y-a.y;applyVB();}
const ptrs=new Map();let dragged=false,startXY=null;
const svgEl=$('plan');
svgEl.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===1){dragged=false;startXY={x:e.clientX,y:e.clientY};}});
svgEl.addEventListener('pointermove',e=>{const prev=ptrs.get(e.pointerId);if(!prev)return;
  const cur={x:e.clientX,y:e.clientY};
  if(ptrs.size===1){if(!dragged&&Math.hypot(cur.x-startXY.x,cur.y-startXY.y)<8)return;if(!dragged)try{svgEl.setPointerCapture(e.pointerId);}catch(_){}dragged=true;panPx(cur.x-prev.x,cur.y-prev.y);}
  else if(ptrs.size===2){dragged=true;const [o]=[...ptrs.entries()].filter(([id])=>id!==e.pointerId);const other=o[1];
    const d0=Math.hypot(prev.x-other.x,prev.y-other.y),d1=Math.hypot(cur.x-other.x,cur.y-other.y);
    const mx=(cur.x+other.x)/2,my=(cur.y+other.y)/2,pmx=(prev.x+other.x)/2,pmy=(prev.y+other.y)/2;
    if(d0>0)zoomAt(mx,my,d1/d0);panPx(mx-pmx,my-pmy);}

svgEl.addEventListener('pointerup',endPtr);svgEl.addEventListener('pointercancel',endPtr);

/* ================= передача замера в «План дома» (дизайн) ================= */
function toDesignPlan(){
  const off=(p,v,k)=>[p[0]+v[0]*k,p[1]+v[1]*k],r3=v=>Math.round(v*1000)/1000;
  const X=p=>r3(p[0]/100),Y=p=>r3(-p[1]/100);
  const walls=[],items=[],elec=[],labels=[];let uid=1;
  const sameH=(a,b)=>{const d=(((a-b)%360)+360)%360;return d<0.01||d>359.99;};
  // пересечение осей двух стен в углу (работает и для внешних, и для внутренних углов)
  const inter=(p1,d1,p2,d2)=>{const cr=d1[0]*d2[1]-d1[1]*d2[0];if(Math.abs(cr)<0.05)return null;const t=((p2[0]-p1[0])*d2[1]-(p2[1]-p1[1])*d2[0])/cr;return [p1[0]+d1[0]*t,p1[1]+d1[1]*t];};
  const raw=[];
  G.rooms.forEach(R=>{const L=R.segs;L.forEach((g,k)=>{
    const prev=k>0?L[k-1]:(R.depth===0&&R.closed?L[L.length-1]:null),next=k<L.length-1?L[k+1]:(R.depth===0&&R.closed?L[0]:null);
    const cornerS=prev&&prev!==g&&!sameH(prev.heading,g.heading)&&Math.hypot(prev.b[0]-g.a0[0],prev.b[1]-g.a0[1])<1;
    const cornerE=next&&next!==g&&!sameH(next.heading,g.heading)&&Math.hypot(next.a0[0]-g.b[0],next.a0[1]-g.b[1])<1;
    g.pieces.forEach((pc,pi)=>{
      if(pc.nb&&pc.nb!==g.room&&G.rooms.indexOf(pc.nb)<G.rooms.indexOf(g.room))return;
      let a=off(off(g.a0,g.u,pc.s),g.n,pc.t/2),b=off(off(g.a0,g.u,pc.e),g.n,pc.t/2);
      // a,b — где стена должна реально начинаться и кончаться; в углу — до наружной грани соседней стены
      if(pi===0&&cornerS){const q=inter(a,g.u,off(prev.b,prev.n,prev.t1),prev.u);if(q&&Math.hypot(q[0]-a[0],q[1]-a[1])<pc.t+prev.t1+2)a=q;}
      if(pi===g.pieces.length-1&&cornerE){const q=inter(b,g.u,off(next.a0,next.n,next.t0),next.u);if(q&&Math.hypot(q[0]-b[0],q[1]-b[1])<pc.t+next.t0+2)b=q;}
      raw.push({a,b,u:g.u,t:pc.t});});
    if(g.k==='door'||g.k==='win'){const t=g.th||g.room.t,c=off(off(g.a0,g.u,g.L/2),g.n,t/2);
      const ux=g.u[0],uy=-g.u[1],a=Math.atan2(uy,ux),mx=-g.n[0],my=g.n[1],side=(-uy*mx+ux*my)>0;
      const it={id:uid++,n:g.k==='win'?'Окно':(g.i===-1?'Дверь входная':'Дверь'),w:r3(g.L/100),h:r3(t/100),sh:g.k,x:X(c),y:Y(c),r:side?a:a+Math.PI};
      if(g.k==='door'){// куда открывается и где петли — как на плане обмера
        const into=(g.child?1:0)^(g.s.out?1:0),no=into?g.n:[-g.n[0],-g.n[1]],ly=[no[0],-no[1]];
        it.r=Math.atan2(-ly[0],ly[1]);const hp=g.s.hinge?g.b:g.a0,mid=off(g.a0,g.u,g.L/2),hd=[hp[0]-mid[0],-(hp[1]-mid[1])];
        if(Math.cos(it.r)*hd[0]+Math.sin(it.r)*hd[1]>0)it.mx=1;}
      items.push(it);}
  });
  if(R.closed&&R.area>1000)labels.push({x:X(R.c),y:Y(R.c),n:R.name,c:null});});
  // склеиваем соседние куски одной прямой стены одинаковой толщины — без швов
  const merged=[];raw.forEach(w=>{const p=merged[merged.length-1];

    if(it.type==='box'){const w=N(it.w)||30,dep=N(it.dep)||25,bh=Math.min(N(it.h)||H,H),c=at(x.p0+w/2,dep/2);
      items.push({id:uid++,n:'Блок 1×1',w:r3(w/100),h:r3(dep/100),sh:'r',x:X(c),y:Y(c),r:rot,ih:r3(bh/100)});tag('Короб',at(x.p0+w/2,dep+15));return;}
